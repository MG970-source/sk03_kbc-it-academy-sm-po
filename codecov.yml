# Codecov configuration — https://docs.codecov.com/docs/codecovyml-reference
#
# Two gates, and they ask different questions.
#
#   project : has coverage of the whole codebase gone down because of this
#             pull request? "auto" means the comparison is against the base
#             branch, so the bar rises by itself as the suite grows.
#   patch   : are the lines this pull request actually changed covered?
#             This is the one that matters. A team can sit at 40% overall and
#             still be disciplined, as long as everything new arrives tested.
#
# Neither number says the software works. Both say something about whether
# anybody executed the code before a customer did.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
    patch:
      default:
        target: 70%
        informational: false

comment:
  layout: "condensed_header, diff, files"
  require_changes: true

ignore:
  - "tests/**"
